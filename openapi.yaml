openapi: 3.0.3
info:
  title: Vecinos Los Naranjos — API (contrato de pedidos y recibos)
  description: >
    Contrato mínimo de los endpoints usados por la plataforma para crear un pedido
    de una vitrina y consultar el recibo de membresía. Sirve como documentación y
    como base para validaciones automáticas (Sesión 9 — API Contracts).
  version: 1.0.0
servers:
  - url: http://localhost:4000
    description: Desarrollo local
  - url: https://losnaranjos.com
    description: Producción

paths:
  /api/orders:
    post:
      summary: Crea un pedido de una vitrina (público)
      description: >
        Se crea tras capturar la identidad del residente (registrado o invitado).
        Nace con estado "Recibido" y canal "whatsapp".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Pedido creado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '400':
          description: Datos incompletos (businessId, productos o identidad del residente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Lista pedidos (solo administrador)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de pedidos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401':
          description: No autorizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/payments/receipt-by-business/{businessId}:
    get:
      summary: Obtiene el recibo aprobado más reciente de un negocio
      parameters:
        - name: businessId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Recibo encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/Receipt' }
        '404':
          description: Sin recibo aprobado aún.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Product:
      type: object
      required: [name, qty]
      properties:
        name:
          type: string
        price:
          type: number
          nullable: true
        qty:
          type: integer
          minimum: 1

    Resident:
      type: object
      required: [fullName, phone, tower, apartment, deliveryAddress]
      properties:
        fullName:
          type: string
        phone:
          type: string
          description: Solo dígitos.
        tower:
          type: string
        apartment:
          type: string
        deliveryAddress:
          type: string
        email:
          type: string
          nullable: true
        authType:
          type: string
          enum: [guest, registered]
          default: guest

    OrderRequest:
      type: object
      required: [businessId, products, resident]
      properties:
        businessId:
          type: string
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderProduct'
        resident:
          $ref: '#/components/schemas/Resident'

    OrderProduct:
      type: object
      required: [name]
      properties:
        name:
          type: string
        price:
          type: number
          nullable: true
        qty:
          type: integer
          minimum: 1

    OrderStatus:
      type: string
      enum: [Recibido, En Preparación, En Camino, Entregado, Cancelado]

    Order:
      type: object
      required: [id, orderId, businessId, products, resident, estado]
      properties:
        id:
          type: string
          example: order-1750000000000
        orderId:
          type: string
          pattern: '^ORD-\d{3,}$'
          example: ORD-123456
        businessId:
          type: string
        businessName:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProduct'
        resident:
          $ref: '#/components/schemas/Resident'
        channel:
          type: string
          example: whatsapp
        estado:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time

    OrderResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/Order'

    Receipt:
      type: object
      required: [receiptId, transactionId, businessId, amountCOP, status]
      properties:
        receiptId:
          type: string
          example: REC-LN-123456
        transactionId:
          type: string
          example: TRX-123456
        businessId:
          type: string
        businessName:
          type: string
        manzana:
          type: string
        concept:
          type: string
        amountCOP:
          type: integer
          example: 50000
        currency:
          type: string
          example: COP
        paymentMethod:
          type: string
        paymentDate:
          type: string
          format: date-time
        coverageStartDate:
          type: string
          format: date-time
        coverageEndDate:
          type: string
          format: date-time
        durationDays:
          type: integer
          example: 30
        status:
          type: string
          example: Aprobado y Activo
        verificationCode:
          type: string
          example: VDLN-AB12CD

    Error:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
